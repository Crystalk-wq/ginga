name: mergeable

on:
  pull_request_target:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: mergeable-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          path: trusted
          persist-credentials: false

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false

      - name: Prepare reports directory
        run: |
          mkdir -p .reports
          printf '{ "workflow": "mergeable", "ok": false }\n' > .reports/bootstrap.json

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Decide mergeability
        env:
          GATE_OUTPUT_ROOT: ${{ github.workspace }}
          GATE_SOURCE_ROOT: ${{ github.workspace }}/candidate
        run: bun trusted/scripts/ci/release-gate.mjs mergeable

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mergeable-reports
          path: .reports
          if-no-files-found: error
          include-hidden-files: true
